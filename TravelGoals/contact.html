<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Contact</title>
    <link rel="icon" type="image/png" href="images/uae-favicon.png" />
    <style>
        body {
            margin: 0;
            background-color: #e9e9e9;
        }

        #header {
            background-color: #c4c4c4;
            padding: 3px;
        }


        li {
            list-style-type: none;
            display: inline;
            font-size: 24px;
            margin-left: 20px;
        }

        a {
            text-decoration: none;
        }

        h1 {
            text-align: center;
            opacity: 0.5;
        }

        #contact-form {
            background-color: #ffffff;
            width: 500px;
            height: 500px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 50px;
            text-align: center;
            padding-top: 20px;
            border: 1px solid #e9e9e9;
        }

        #input-top {
            margin-top: 70px;
        }

        .input-item {
            border: 0;
            background-color: #e9e9e9;
            padding: 15px;
            border-radius: 10px;
            margin-left: auto;
            margin-right: auto;
            width: 300px;
            margin-top: 30px;
            font-size: 18px;
            outline:none;
        }

        #submit-btn {
            padding: 15px;
            border: 0;
            margin-top: 50px;
            background-color: #c4c4c4;
            width: 320px;
            border-radius: 10px;
            font-size: 18px;
            cursor:pointer;
        }

        footer {
            text-align: right;
            background-color: #c4c4c4;
            padding: 3px;
        }
    </style>
</head>
<body>
    <header id="header">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <h1>Contact Us</h1>
    <form id="contact-form" method="get">

        <input id="input-top" class="input-item" type="text" name="Name" placeholder="Name" required /><br />
        <input class="input-item" type="email" name="Email" placeholder="Email" required /><br />
        <input class="input-item" type="tel" name="Number" placeholder="Phone Number" required /><br />
        <input id="submit-btn" type="submit" value="Submit" />
    </form>

    <footer>

        <p>Developed by Nompumelelo Mashele</p>

    </footer>


</body>
</html>
